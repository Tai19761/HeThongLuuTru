global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "master-nodes"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["master-node-1:8000", "master-node-2:8000"]

  - job_name: "storage-nodes"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["storage-node-1:8081", "storage-node-2:8082"]
