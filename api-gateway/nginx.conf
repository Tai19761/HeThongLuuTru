events {
    worker_connections 1024;
}

http {
    # Cụm 2 Master Node - Nginx chia request luân phiên (Round-Robin)
    upstream master_cluster {
        server master-node-1:8000 max_fails=2 fail_timeout=10s;
        server master-node-2:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location /api/master/ {
            proxy_pass http://master_cluster/api/master/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Nếu 1 Master không phản hồi sau 2s hoặc lỗi -> chuyển ngay sang Master còn lại
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
