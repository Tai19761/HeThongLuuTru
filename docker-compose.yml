services:
  # 1. DATABASE (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: harbor_db
    restart: always
    environment:
      POSTGRES_DB: harbor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      # Cổng 5433 bên ngoài để không đụng PostgreSQL cài sẵn trên Windows (5432)
      - "5433:5432"
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harbor_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. MASTER NODE 1
  # Không mở cổng 8000 ra ngoài: trình duyệt phải đi qua API Gateway (cổng 8080)
  master-node-1:
    build: ./master-node
    container_name: harbor_master_1
    restart: on-failure
    expose:
      - "8000"
    depends_on:
      postgres_db:
        condition: service_healthy # Đợi DB sẵn sàng rồi mới chạy Master
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/harbor_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      # Chỉ Master 1 tự tạo danh sách Storage Node khi DB trống (tránh tạo trùng)
      - STORAGE_SEED_ENABLED=true
      # Địa chỉ trình duyệt dùng để gọi Storage Node (được lưu vào DB khi tự tạo node)
      - STORAGE_SEED_HOST=localhost
      # Địa chỉ Master dùng để gọi Storage Node trong mạng Docker (khi xóa file)
      - STORAGE_HOST_8081=storage-node-1
      - STORAGE_HOST_8082=storage-node-2

  # 3. MASTER NODE 2 (Active-Active, cùng code và cùng Database với Master 1)
  master-node-2:
    build: ./master-node
    container_name: harbor_master_2
    restart: on-failure
    expose:
      - "8000"
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/harbor_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - STORAGE_SEED_ENABLED=false
      - STORAGE_HOST_8081=storage-node-1
      - STORAGE_HOST_8082=storage-node-2

  # 4. STORAGE NODE 1
  storage-node-1:
    build: ./storage-node-1
    container_name: harbor_storage_1
    restart: on-failure
    ports:
      - "8081:8081"
    depends_on:
      - api-gateway
    environment:
      - STORAGE_BASE_DIR=/app/data
      # Báo cáo "đã lưu mảnh" qua API Gateway -> Master nào còn sống sẽ nhận
      - MASTER_URL=http://api-gateway:80
    volumes:
      # File upload được lưu ra máy thật, không mất khi xóa/build lại container
      - ./storage-data/kho-1:/app/data

  # 5. STORAGE NODE 2
  storage-node-2:
    build: ./storage-node-2
    container_name: harbor_storage_2
    restart: on-failure
    ports:
      - "8082:8082"
    depends_on:
      - api-gateway
    environment:
      - STORAGE_BASE_DIR=/app/data
      - MASTER_URL=http://api-gateway:80
    volumes:
      - ./storage-data/kho-2:/app/data

  # 6. FRONTEND (React)
  frontend:
    build: ./harbor-frontend
    container_name: harbor_react
    restart: always
    ports:
      - "5173:80" # Map port 5173 bên ngoài vào port 80 của Nginx bên trong
    depends_on:
      - api-gateway

  # 7. API GATEWAY (Nginx) - cổng vào chung + cân bằng tải 2 Master
  api-gateway:
    image: nginx:alpine
    container_name: harbor_api_gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - master-node-1
      - master-node-2

# Lưu trữ dữ liệu Database
volumes:
  postgres_data_new:
