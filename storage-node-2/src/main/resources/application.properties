spring.application.name=storage-node-2
server.port=8082
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Thư mục lưu file thật (Docker truyền STORAGE_BASE_DIR=/app/data, chạy local dùng D:/Kho_2/)
storage.base-dir=${STORAGE_BASE_DIR:D:/Kho_2/}

# Địa chỉ Master Node (Docker truyền MASTER_URL=http://master-node:8000)
master.url=${MASTER_URL:http://localhost:8000}


management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.observations.key-values.application=${spring.application.name}